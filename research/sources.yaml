# The sources behind Bayora's claims. `bayora research collect` fetches each one with TinyFish and
# fingerprints it; `bayora research seal` signs the list into a Merkle log anyone can check.
#
# read: how much of the source a person (or Claude) read before it was cited. Be honest here.
#   full      the whole page or document
#   section   the relevant section of a long page
#   abstract  the abstract or summary page only, not the full paper
#   snippet   a search-result excerpt only: not yet read
#   searched  searched for specific terms; the rest was not read closely

claims:
  C1: "Article 55(1)(a) of the EU AI Act requires providers of general-purpose AI models with systemic risk to perform model evaluation including conducting and documenting adversarial testing."
  C2: "The Commission's AI Office treats external evaluators' independence from the provider's managerial, financial and operational influence as a requirement for reliable evaluations (workshop of 15 July 2026)."
  C3: "Sharing the KV cache between tenants of an LLM server lets an attacker who can time its own prompts reconstruct other users' prompts."
  C4: "Global prompt-cache sharing across users was detected in seven LLM API providers, including OpenAI."
  C5: "vLLM documents the prefix-cache timing channel as CVE-2025-46570, names per-tenant cache_salt as the mitigation, and says the salt must be a long random secret."
  C6: "The cache_salt mitigation has failed silently in a released version (vLLM up to 0.25.1, fixed in 0.30.0), so an endpoint has to be tested, not trusted."
  C7: "A sandboxed AI agent can learn a lot about its evaluation environment, which threatens the validity of the evaluation."
  C8: "In the documents searched, evaluation sandboxes and red-teaming tools do not describe red/blue separation, committed payloads or tamper-evident audit receipts."
  C9: "Bayora's Merkle log uses the RFC 9162 leaf, node and split rules."
  C10: "Bayora's receipt follows the in-toto Statement v1 layout inside a DSSE envelope."
  C11: "Bayora's witness cosignature is not C2SP tlog-cosignature compatible: it lacks the cosignature/v1 domain separation and the timestamp."
  C13: "The GPAI Code of Practice (published 10 July 2025) has a Safety and Security chapter for providers of models under Article 55; its official page lists 22 signatories plus xAI for that chapter only (page updated 7 October 2026). This shows regulatory context, not customer demand."
  C12: "TinyFish provides the Fetch, Search and Monitor APIs used to collect and watch these sources."

