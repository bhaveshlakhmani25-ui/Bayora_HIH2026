# Bayora run configuration. Pass your own file with `bayora run -c my.yaml`;
# any key you leave out keeps the value below.

image: bayora/py:poc          # any image with python3; on a normal machine build FROM python:3.12-slim

# One Docker --internal network per zone. The broker joins red and model;
# it is the only path from red to the model.
zones:
  red: bz_red
  blue: bz_blue
  model: bz_model

# Monitored channels. Anything not listed here is unmonitored and is residual risk.
channels: [container_log, filesystem, network_broker, model_output]

# Encodings the leak drills use. The first six are the PoC set; spelled, reversed and described are paraphrases.
# partial (14-char fragment) is caught only by scanner v3; described (two 9-char pieces) is below v3's K=10.
encodings: [plain, lowercase, base64, hex, split, partial, spelled, reversed, described]

# Egress enforcer on top of the --internal networks. auto = ebpf when bcc and root are
# available where dockerd runs (Colima VM or Linux host), else docker networks only.
enforcer: auto                # auto | ebpf | docker

# Real model for the cache-timing audit (bayora cachetest). The GGUF is downloaded separately into models/.
model_path: models/qwen2.5-0.5b-instruct-q4_k_m.gguf
llm_threads: 4
cache_trials: 20             # trials per condition; each trial probes all 8 candidates
cache_audit: false           # bayora run: preflight cache-timing audit on the real model, logged in the ledger

drills_per_cell: 5            # drills per (channel, encoding) pair
noise_lines: 10000            # benign lines scanned for false positives
load_requests: 500            # requests per load run (3 runs)
