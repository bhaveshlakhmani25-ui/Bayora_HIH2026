<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayora Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14171c; --muted: #5b6472; --line: #dde1e7;
    --ok: #127a43; --ok-bg: #e3f4ea; --bad: #b42318; --bad-bg: #fde8e6; --warn: #8a5a00; --warn-bg: #fff3d6;
    --red: #c2410c; --blue: #1d4ed8; --model: #6d28d9; --broker: #0f766e; --accent: #1d4ed8;
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --panel: #161a21; --ink: #e8ebf0; --muted: #9aa4b2; --line: #2a303a;
    --ok: #4ade80; --ok-bg: #12301f; --bad: #f87171; --bad-bg: #3a1614; --warn: #fbbf24; --warn-bg: #3a2c0b;
    --red: #fb923c; --blue: #60a5fa; --model: #a78bfa; --broker: #2dd4bf; --accent: #60a5fa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1116; --panel: #161a21; --ink: #e8ebf0; --muted: #9aa4b2; --line: #2a303a;
      --ok: #4ade80; --ok-bg: #12301f; --bad: #f87171; --bad-bg: #3a1614; --warn: #fbbf24; --warn-bg: #3a2c0b;
      --red: #fb923c; --blue: #60a5fa; --model: #a78bfa; --broker: #2dd4bf; --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 22px; margin: 0; letter-spacing: .2px; }
  header .meta { color: var(--muted); font-size: 14px; flex: 1; min-width: 240px; }
  main { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; padding: 16px 24px 40px; max-width: 1500px; margin: 0 auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
  section h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 12px; }
  .s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; } .s6 { grid-column: span 6; }
  @media (max-width: 1000px) { .s8, .s7, .s5, .s4, .s6 { grid-column: span 12; } main { padding: 12px 16px 32px; } header { padding: 14px 16px; } }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .ok { color: var(--ok); background: var(--ok-bg); } .bad { color: var(--bad); background: var(--bad-bg); } .warn { color: var(--warn); background: var(--warn-bg); }
  .verdict { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .kpi .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .matrix td.c { text-align: center; font-weight: 600; border-radius: 4px; }
  .scroll { overflow-x: auto; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .feed { max-height: 420px; overflow-y: auto; font-size: 14px; }
  .ev { display: grid; grid-template-columns: 54px 150px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .ev .k { font-weight: 600; } .ev .i { color: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
  .muted { color: var(--muted); font-size: 14px; }
  details { margin-top: 8px; } summary { cursor: pointer; color: var(--muted); }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; max-height: 360px; font-size: 12px; }
  svg text { fill: var(--ink); font: 13px system-ui, sans-serif; }
  .live { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>Bayora</h1>
  <div class="meta" id="meta">Loading…</div>
  <button id="theme" aria-label="Toggle light or dark theme">Theme</button>
  <button class="primary" id="verify">Verify receipt</button>
</header>
<main>
  <section class="s12" id="verdict-wrap" hidden><h2>Receipt verification</h2><div id="verdict"></div></section>
  <section class="s12"><h2>Headline (this run)</h2><div class="kpis" id="kpis"></div><p class="muted" id="env"></p></section>
  <section class="s7"><h2>Trust zones and probe results</h2><div class="scroll"><svg id="zones" viewBox="0 0 760 300" width="100%" role="img" aria-label="Zones diagram"></svg></div><div id="probes"></div></section>
  <section class="s5"><h2><span class="live" aria-hidden="true"></span>Live alerts</h2><div class="feed" id="feed"><p class="muted">No alerts yet.</p></div></section>
  <section class="s8"><h2>Leak-drill coverage (channel × encoding)</h2><div class="tabs" id="modes" role="tablist"></div><div class="scroll" id="matrix"></div><p class="muted" id="matrix-note"></p></section>
  <section class="s4"><h2>Cache-timing audit</h2><div id="cache"><p class="muted">No cache audit in this run.</p></div></section>
  <section class="s12"><h2>Checkpoints and witness cosignatures</h2><div class="scroll" id="cps"></div></section>
  <section class="s12"><h2>Raw data</h2><div id="raw"></div></section>
</main>
<script>
"use strict";
// Every value from the results/log is inserted with textContent, never parsed as HTML.
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) (k === "class" ? (e.className = v) : e.setAttribute(k, v));
  for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : String(k));
  return e;
}
const pill = (text, cls) => h("span", { class: "pill " + cls }, text);
const blocked = (v) => typeof v === "string" && /BLOCKED|NOT MOUNTED|READ-ONLY/.test(v);

try { const t = localStorage.getItem("bayora-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("theme").onclick = () => {
  const dark = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() === "#0e1116";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("bayora-theme", document.documentElement.dataset.theme); } catch (e) {}
};

let S = null, since = 0, mode = null;

function kpis(r, st) {
  const k = $("kpis"); k.replaceChildren();
  const add = (v, l, cls) => k.append(h("div", { class: "kpi" }, h("div", { class: "v " + (cls || "") }, v), h("div", { class: "l" }, l)));
  if (!r) { add("–", "no results.json yet"); return; }
  const p = r.isolation_probes || {};
  const cross = Object.entries(p).filter(([n]) => n.startsWith("red->") && n !== "red->broker");
  add(`${cross.filter(([, v]) => blocked(v)).length}/${cross.length}`, "forbidden paths blocked (incl. red→broker other port)");
  add(r.isolation ? r.isolation.enforcer : "docker", `enforcer · ${r.isolation && r.isolation.blocked_connects != null ? r.isolation.blocked_connects + " blocked connects logged" : "no eBPF"}`);
  for (const m of Object.keys(r.leak_drills || {})) { const d = r.leak_drills[m]; add(`${d.detected}/${d.total}`, `drills caught by scanner ${m} · ${d.false_positives} FP`); }
  if (r.tamper) { const t = [r.tamper.edited_event_rejected, r.reveal && r.reveal.tampered_payload_rejected, r.tamper.split_view_refused_by_witness]; add(`${t.filter(Boolean).length}/3`, "tamper tests rejected"); }
  if (r.function) add(`${r.function.containers_p50_ms.toFixed(2)} ms`, `p50 via containers (host baseline ${r.function.baseline_p50_ms.toFixed(2)} ms)`);
  if (r.cache_audit) add(r.cache_audit.pass ? "PASS" : "FAIL", "cache-timing preflight (salted at chance)", r.cache_audit.pass ? "ok" : "bad");
}

function zones(r) {
  const svg = $("zones"); svg.replaceChildren();
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, a, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (text != null) e.textContent = text; svg.append(e); return e; };
  const p = (r && r.isolation_probes) || {};
  const box = (x, y, w, label, sub, color) => {
    el("rect", { x, y, width: w, height: 64, rx: 10, fill: "none", stroke: color, "stroke-width": 2.5 });
    el("text", { x: x + w / 2, y: y + 27, "text-anchor": "middle", "font-weight": 700 }, label);
    el("text", { x: x + w / 2, y: y + 47, "text-anchor": "middle", fill: "currentColor", opacity: .7, "font-size": 12 }, sub);
  };
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const edge = (x1, y1, x2, y2, name, lx, ly) => {
    const v = p[name]; const ok = name === "red->broker" ? v === "CONNECTED" : blocked(v);
    el("line", { x1, y1, x2, y2, stroke: v == null ? css("--line") : (name === "red->broker" ? css("--ok") : css("--bad")), "stroke-width": 2, "stroke-dasharray": name === "red->broker" ? "" : "6 5" });
    el("text", { x: lx, y: ly, "text-anchor": "middle", "font-size": 12 }, `${name.replace("red->", "→ ")}: ${v == null ? "not probed" : v}${v == null ? "" : ok ? " ✓" : " ✗"}`);
  };
  box(20, 118, 150, "Red zone", "attack payloads", css("--red"));
  box(305, 118, 150, "Broker", "only cross-zone path", css("--broker"));
  box(590, 118, 150, "Model", "serving zone", css("--model"));
  box(305, 226, 150, "Blue zone", "defensive rules", css("--blue"));
  el("rect", { x: 590, y: 14, width: 150, height: 44, rx: 22, fill: "none", stroke: css("--muted"), "stroke-width": 1.5 });
  el("text", { x: 665, y: 41, "text-anchor": "middle" }, "Internet");
  edge(170, 150, 305, 150, "red->broker", 237, 142);
  el("line", { x1: 455, y1: 150, x2: 590, y2: 150, stroke: css("--ok"), "stroke-width": 2 });
  el("text", { x: 522, y: 142, "text-anchor": "middle", "font-size": 12 }, "broker → model ✓");
  edge(120, 182, 305, 258, "red->blue", 175, 245);
  edge(95, 118, 600, 58, "red->internet", 330, 72);
  edge(140, 118, 640, 118, "red->model_direct", 470, 104);
  const pr = $("probes"); pr.replaceChildren();
  const extra = Object.entries(p).filter(([n]) => !["red->broker", "red->blue", "red->internet", "red->model_direct"].includes(n));
  if (extra.length) pr.append(h("table", {}, h("tbody", {}, extra.map(([n, v]) => h("tr", {}, h("td", {}, n), h("td", {}, pill(v, blocked(v) ? "ok" : "bad")))))));
  if (r && r.isolation && r.isolation.allow) pr.append(h("p", { class: "muted" }, "Allow-list per zone: " + Object.entries(r.isolation.allow).map(([z, a]) => `${z} → ${a.length ? a.map((x) => x.join(":")).join(", ") : "nothing"}`).join(" · ")));
}

function matrix(r) {
  const drills = (r && r.leak_drills) || {}; const modes = Object.keys(drills);
  const tabs = $("modes"); tabs.replaceChildren();
  if (!modes.length) { $("matrix").replaceChildren(h("p", { class: "muted" }, "No drill results.")); return; }
  if (!modes.includes(mode)) mode = modes[modes.length - 1];
  for (const m of modes) { const b = h("button", { role: "tab", "aria-selected": String(m === mode) }, `scanner ${m}`); b.onclick = () => { mode = m; matrix(r); }; tabs.append(b); }
  const cells = drills[mode].by_channel_encoding;
  const chans = [...new Set(Object.keys(cells).map((k) => k.split("|")[0]))], encs = [...new Set(Object.keys(cells).map((k) => k.split("|")[1]))];
  const t = h("table", { class: "matrix" }, h("thead", {}, h("tr", {}, h("th", {}, "channel"), encs.map((e) => h("th", {}, e)))),
    h("tbody", {}, chans.map((c) => h("tr", {}, h("th", {}, c), encs.map((e) => {
      const v = cells[`${c}|${e}`]; if (!v) return h("td", {}, "–");
      const f = v[0] / v[1]; return h("td", { class: "c " + (f === 1 ? "ok" : f === 0 ? "bad" : "warn") }, `${v[0]}/${v[1]}`);
    })))));
  $("matrix").replaceChildren(t);
  const d = drills[mode];
  $("matrix-note").textContent = `Scanner ${mode}: ${d.detected}/${d.total} drills detected, ${d.false_positives} false positives in ${r.noise_lines_scanned ?? "?"} noise lines. A clean scan is not proof of zero leakage: unmonitored paths are residual risk.`;
}

function cache(r, ct) {
  const c = ct || (r && r.cache_audit); if (!c) return;
  const row = (name) => { const x = c[name]; return h("tr", {}, h("td", {}, name), h("td", {}, `${x.correct}/${x.trials}`), h("td", {}, (x.chance * 100).toFixed(1) + "%"), h("td", {}, x.p_value_vs_chance.toPrecision(2)), h("td", {}, String(x.cross_tenant_cache_hits ?? "–"))); };
  $("cache").replaceChildren(
    h("p", {}, pill(c.pass ? "PASS: salted probe at chance" : "FAIL: salted probe beats chance", c.pass ? "ok" : "bad")),
    h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "condition"), h("th", {}, "B correct"), h("th", {}, "chance"), h("th", {}, "p"), h("th", {}, "cache hits"))), h("tbody", {}, row("shared"), row("salted"))),
    h("p", { class: "muted" }, `${c.engine} · ${c.model} · sha256 ${String(c.model_sha256).slice(0, 16)}…`),
    h("p", { class: "muted" }, c.environment));
}

function checkpoints(r, cps) {
  const rows = cps.length ? cps.map((c) => ({ size: c.size, root: c.root, signers: c.signers })) :
    ((r && r.ledger && r.ledger.checkpoints) || []).map((c) => ({ size: c.size, root: null, signers: ["operator", ...c.cosigned_by] }));
  if (!rows.length) { $("cps").replaceChildren(h("p", { class: "muted" }, "No checkpoints.")); return; }
  const alarms = r && r.ledger && r.ledger.witness_alarms ? Object.entries(r.ledger.witness_alarms).filter(([, a]) => a.length) : [];
  $("cps").replaceChildren(h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "size"), h("th", {}, "root"), h("th", {}, "signed / cosigned by"))),
    h("tbody", {}, rows.map((c) => h("tr", {}, h("td", {}, c.size), h("td", { class: "mono" }, c.root ? c.root.slice(0, 32) + "…" : "(not published)"), h("td", {}, c.signers.map((s) => pill(s, s === "operator" ? "warn" : "ok")).flatMap((x) => [x, " "])))))),
    alarms.length ? h("p", {}, pill("witness alarms", "bad"), " ", alarms.map(([w, a]) => `${w}: ${a.join("; ")}`).join(" · ")) : null);
}

function raw(st) {
  const blocks = [["results.json", st.results], ["receipt (in-toto statement)", st.statement || st.receipt], ["cache test", st.cachetest]];
  $("raw").replaceChildren(...blocks.filter(([, v]) => v).map(([n, v]) => h("details", {}, h("summary", {}, n), h("pre", {}, JSON.stringify(v, null, 2)))));
}

const SHOW = { leak_alert: "bad", blocked_connect: "warn", cache_audit: "ok", isolation_probe: "ok", reveal: "ok", commitment: "ok" };
function describe(e) {
  switch (e.kind) {
    case "leak_alert": return `${e.src_tenant} canary seen in ${e.observed_channel} (slot ${e.slot}, ${e.canary})`;
    case "blocked_connect": return `${e.zone} → ${e.dst}:${e.port} denied by ${e.enforcer} (pid ${e.pid}, ${e.comm})`;
    case "cache_audit": return `${e.engine}: shared ${e.shared_correct}/${e.shared_trials}, salted ${e.salted_correct}/${e.salted_trials} · ${e.passed ? "PASS" : "FAIL"}`;
    case "isolation_probe": return `${e.probe}: ${e.result}`;
    case "commitment": return `${e.tenant} committed ${String(e.digest).slice(0, 16)}…`;
    default: return Object.entries(e).filter(([k]) => !["run", "ts", "kind", "index"].includes(k)).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join(" ");
  }
}
async function poll() {
  try {
    const r = await (await fetch(`/api/events?since=${since}`)).json();
    if (r.total < since) { since = 0; $("feed").replaceChildren(); return poll(); }   // log was replaced by a new run
    const feed = $("feed");
    const shown = r.events.filter((e) => e.kind in SHOW);
    if (shown.length && feed.querySelector("p.muted")) feed.replaceChildren();
    for (const e of shown) feed.prepend(h("div", { class: "ev" }, h("span", { class: "i" }, "#" + e.index), h("span", { class: "k" }, pill(e.kind, SHOW[e.kind])), h("span", {}, describe(e))));
    since = r.total;
  } catch (e) {}
}

async function load() {
  S = await (await fetch("/api/state")).json();
  const r = S.results, st = S.statement;
  const host = r && r.host ? `${r.host.platform} · ${r.host.cpus} CPUs${r.host.docker ? " · docker " + r.host.docker.context + (r.host.docker.userns_remap ? " (userns-remap)" : "") + (r.host.docker.rootless ? " (rootless)" : "") : ""}` : "";
  $("meta").textContent = `${r ? r.run_id : "no run"} · ${S.dir}`;
  $("env").textContent = host ? `Environment: ${host}. Numbers apply to this environment only.` : "";
  kpis(r, st); zones(r); matrix(r); cache(r, S.cachetest); checkpoints(r, S.checkpoints); raw(S);
}

$("verify").onclick = async () => {
  const b = $("verify"); b.disabled = true; b.textContent = "Verifying…";
  try {
    const r = await (await fetch("/api/verify", { method: "POST" })).json();
    $("verdict-wrap").hidden = false;
    $("verdict").replaceChildren(pill(r.ok ? "VERIFIED" : "FAILED", r.ok ? "ok" : "bad"), h("div", { class: "verdict " + (r.ok ? "ok" : "bad") }, r.message), h("p", { class: "muted" }, "Trust: " + r.trust));
  } finally { b.disabled = false; b.textContent = "Verify receipt"; }
};

load(); poll(); setInterval(poll, 1500); setInterval(load, 10000);
</script>
</body>
</html>
