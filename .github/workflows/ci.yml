name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests
      - run: bayora drill
  # Full run on a Linux docker host with the eBPF enforcer (bcc runs as root next to dockerd).
  docker-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-bpfcc linux-headers-$(uname -r)
      - run: pip install -e .
      - run: docker build -t bayora/py:poc .
      - run: |
          echo "enforcer: ebpf" > ci.yaml
          bayora run -c ci.yaml -o results/ci
      - run: bayora verify results/ci/receipt.json results/ci/log.jsonl
      - name: eBPF enforced and blocked attempts logged
        run: |
          python -c "import json; r=json.load(open('results/ci/results.json')); print(r['isolation'], r['isolation_probes']); assert r['isolation']['enforcer']=='ebpf' and r['isolation']['blocked_connects']>=4"
      - uses: actions/upload-artifact@v4
        with:
          name: results-ci
          path: results/ci
