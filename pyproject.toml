[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayora"
version = "0.1.0"
description = "Blind, leak-audited red-vs-blue AI safety evaluation with verifiable receipts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bayora = "bayora.cli:main"

[tool.setuptools]
packages = ["bayora"]

[tool.setuptools.package-data]
bayora = ["default.yaml"]
